[match_watcher]           # OQ-03: filled in T-006 from the author's console.log of 2026-11-06 (3 public matches)
# Start: the Steam datagram ticket for a real match. The hideout ticket says hideout_lobby=..., not match_id=,
# so hideout, loopback and 127.0.0.1 sessions and the post-match hideout connect never match.
start    = 'Received Steam datagram ticket for server steamid:\d+ vport -?\d+\. match_id=\d+'
# End: the client's game state changes to PostGame (8) when the match is decided. It is not in the hideout.
end      = 'OnGameStateChanged: PostGame \(8\)'
# Match ID: the lobby line that follows the ticket, "Lobby <id> for Match <match id> created".
match_id = '\bLobby \d+ for Match (\d+) created'
# Exit: the engine's quit request, written once as the game closes.
exit     = '\[HostStateManager\] HostStateRequest::Start\(HSR_QUIT\)'
poll_s   = 1              # fallback poll when file notifications miss an event

[api]
analytics_per_min   = 160     # 80% of 200
players_per_sec     = 80      # 80% of 100
other_per_min       = 60
history_ttl_s       = 21600
analytics_ttl_s     = 86400
# published limit, 80% (T-009, pending doc 14 update)
metadata_bulk_per_min = 24    # API-05 bulk: 30 req/min
rank_per_min          = 16    # API-02 rank batch: 20 req/min
# T-009 additions, pending doc 14 update
timeout_cooldown_s    = 300   # no same-query retry after a 504 (doc 04 client rules)
busy_retry_default_s  = 30    # used when a 503 or 429 has no Retry-After
assets_ttl_s          = -1    # until the patch changes
client_versions_ttl_s = 3600  # how often to check for a new patch
metadata_ttl_s        = 31536000  # match metadata is immutable; one year stands in for "forever"
# DEC-049 additions; documented in doc 14 by DEC-058
live_url_per_hour     = 4     # per-match Broadcast locator: 6 req/h per IP published, 80%

[broadcast]
backoff_s           = [2, 4, 8, 16, 32]
stale_delay_s       = 60      # DEC-050
request_timeout_s   = 5       # per request to the relay (DEC-058)


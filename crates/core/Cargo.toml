[package]
name = "stalemate-core"
description = "Stalemate core library: data sources, scouting, recommendations, review, storage."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "stalemate_core"

[features]
# Enables tests that need recorded fixtures under tests/fixtures (doc 16).
fixtures = []
# Broadcast parsing through the vendored haste (DEC-049). Pulls in mars, which has no
# licence, so release builds must use --no-default-features until it does.
broadcast = ["dep:haste", "dep:http"]
default = ["broadcast"]
# Builds protoc from source for valveprotos. Only the Flatpak needs it: the KDE SDK has
# protoc but not the google/protobuf include files.
protobuf-src = ["haste?/protobuf-src"]

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
# gzip: the Broadcast relay sends gzip-compressed fragments; reqwest decodes them before haste and the recorder.
reqwest = { workspace = true, features = ["rustls", "json", "query", "gzip"] }
governor.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
notify.workspace = true
regex.workspace = true
keyvalues-parser.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
url.workspace = true
async-trait.workspace = true
time = { workspace = true, features = ["formatting", "parsing", "serde", "macros"] }
dirs.workspace = true
haste = { workspace = true, features = ["broadcast", "deadlock"], optional = true }
# Raw fragment bytes (MIT). `http` is only for haste's HttpClient trait types (MIT/Apache-2.0).
bytes = "1"
http = { version = "1", optional = true }
# Diagnostics zip (FR-SET-005). MIT. Deflate only, with the pure-Rust zlib-rs backend: no bzip2, zstd or lzma C code.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { workspace = true, features = ["tokio", "native_crypto"] }

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["v1", "windows-native-keyring-store"] }
# Steam path from the registry (MIT/Apache-2.0). Only read, never written (NFR-PLAT-003).
windows-registry = "0.6"
# Own-process CPU and memory for the diagnostics file (MIT/Apache-2.0).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["test-util"] }

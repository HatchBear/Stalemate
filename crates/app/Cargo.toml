[package]
name = "stalemate-app"
description = "Stalemate desktop app (Slint UI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "stalemate"
path = "src/main.rs"

[dependencies]
stalemate-core.workspace = true
slint.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json.workspace = true
tracing.workspace = true
time = { workspace = true, features = ["formatting", "parsing", "local-offset"] }
dirs.workspace = true
fluent-bundle = "0.16"
unic-langid = "0.9"


[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
regex.workspace = true
tempfile.workspace = true
i-slint-backend-testing = "1.18"
# Writes the review screenshots (MIT or Apache-2.0).
png = "0.18"

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/overlay",
    "crates/model-trainer",
    "crates/fixture-recorder",
    "tests/compliance",
]
# haste is a vendored third-party workspace with its own manifest (DEC-049).
exclude = ["third_party/haste"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/HatchBear/Stalemate"
version = "0.1.0"
rust-version = "1.98"

[workspace.dependencies]
stalemate-core = { path = "crates/core" }
tokio = "1.54"
reqwest = { version = "0.13", default-features = false }
governor = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1.2"
rusqlite = "0.41"
notify = "8.2"
regex = "1.13"
keyvalues-parser = "0.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
uuid = "1.29"
url = "2.5"
async-trait = "0.1"
time = "0.3"
dirs = "7"
oo7 = { version = "0.7", default-features = false }
keyring = { version = "4.2", default-features = false }
haste = { path = "third_party/haste", default-features = false }
tempfile = "3"
proptest = "1.12"
wiremock = "0.6"
slint = "1.18"
slint-build = "1.18"

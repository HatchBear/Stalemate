name: flatpak
on:
  workflow_call: {}
  # Manual builds only. Packages are never built on push (DEC-081).
  workflow_dispatch: {}

jobs:
  # cargo-sources.json is generated from Cargo.lock. It is not committed.
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh scripts/flatpak-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak/cargo-sources.json
          if-no-files-found: error
          retention-days: 1

  bundle:
    needs: sources
    runs-on: ubuntu-latest
    container:
      # KDE 6.11 matches runtime-version in the manifest (OQ-17). Change both together.
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: stalemate.flatpak
          manifest-path: packaging/flatpak/io.github.hatchbear.stalemate.yml
          cache-key: flatpak-builder-${{ github.sha }}
          # The action cannot set retention, so it does not upload (DEC-081).
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: stalemate.flatpak
          path: stalemate.flatpak
          retention-days: 1
          if-no-files-found: error

name: flatpak
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_call: {}

jobs:
  # cargo-sources.json is generated from Cargo.lock. It is not committed.
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh scripts/flatpak-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak/cargo-sources.json
          if-no-files-found: error

  bundle:
    needs: sources
    runs-on: ubuntu-latest
    container:
      # KDE 6.11 matches runtime-version in the manifest (OQ-17). Change both together.
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: stalemate.flatpak
          manifest-path: packaging/flatpak/io.github.hatchbear.stalemate.yml
          cache-key: flatpak-builder-${{ github.sha }}
          # The action uploads the bundle as an artifact named after `bundle`.
          upload-artifact: true

name: windows
on:
  push:
    branches: [main]
    tags: ['v*', '[0-9][0-9]w[0-9][0-9]a*']
  workflow_call: {}

jobs:
  build:
    runs-on: windows-latest
    env:
      # Link the C runtime statically so the MSI needs no Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      # valveprotos needs protoc at build time (DEC-049).
      - run: choco install protoc -y
      - run: cargo build --release --workspace
      - run: cargo test --workspace
      - name: Fair-play symbol check on the Windows binaries (TST-030)
        shell: bash
        run: bash scripts/fair-play-check.sh --require-binaries
      # WiX 5.0.2 is the last release under MS-RL. WiX 6 and later use the OSMF licence.
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build the MSI and the portable zip (T-028a)
        run: >-
          pwsh -NoProfile -File scripts/package-windows.ps1
          ${{ startsWith(github.ref, 'refs/tags/v') && format('-Version {0}', github.ref_name) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: stalemate-windows
          path: |
            target/package/windows/*.msi
            target/package/windows/*.zip
          if-no-files-found: error
      # The overlay is Beta, so the installer does not carry it. CI still builds it and keeps it.
      - uses: actions/upload-artifact@v4
        with:
          name: stalemate-windows-binaries
          path: |
            target/release/stalemate.exe
            target/release/stalemate-overlay.exe
          if-no-files-found: error
      # TODO(Beta): publish the .NET fallback parser (PRG-21) and add stalemate-overlay.exe
      # to the MSI (T-028).

name: linux-native
# Native Linux packages besides the Flatpak (T-004a, DEC-064, NFR-PLAT-005, TST-094).
# The binary is built once in Ubuntu 22.04 (glibc 2.35) so every package runs on older distros.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_call: {}

env:
  CARGO_DEB_VERSION: 3.8.0
  CARGO_GENERATE_RPM_VERSION: 0.21.1
  APPIMAGETOOL_VERSION: 1.9.1
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: System dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config cmake binutils file xz-utils \
            protobuf-compiler libprotobuf-dev libfontconfig1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libdbus-1-dev
      - uses: actions/checkout@v4
      - name: Rust 1.98.1
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p stalemate-app --locked
      - name: Fair-play symbol check on the Linux binary (TST-030)
        run: bash scripts/fair-play-check.sh --require-binaries
      - name: glibc floor
        run: |
          objdump -T target/release/stalemate | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
      - name: Packaging tools
        run: |
          cargo install --locked cargo-deb --version "$CARGO_DEB_VERSION"
          cargo install --locked cargo-generate-rpm --version "$CARGO_GENERATE_RPM_VERSION"
          curl -fsSL -o /usr/local/bin/appimagetool "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          echo "$APPIMAGETOOL_SHA256  /usr/local/bin/appimagetool" | sha256sum -c -
          chmod +x /usr/local/bin/appimagetool
      - name: Build the packages
        run: |
          export VERSION="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
          bash scripts/package-linux.sh tarball
          bash scripts/package-linux.sh deb
          bash scripts/package-linux.sh rpm
          bash scripts/package-linux.sh appimage
          ls -l target/package/linux
      - uses: actions/upload-artifact@v4
        with:
          name: stalemate-linux-native
          path: |
            target/package/linux/*.deb
            target/package/linux/*.rpm
            target/package/linux/*.AppImage
            target/package/linux/*.tar.gz
          if-no-files-found: error

  # Install each package in a clean container and start the app (TST-094).
  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'debian:stable', kind: deb, glob: '*.deb' }
          - { image: 'ubuntu:22.04', kind: deb, glob: '*.deb' }
          - { image: 'ubuntu:24.04', kind: deb, glob: '*.deb' }
          - { image: 'fedora:latest', kind: rpm, glob: '*.rpm' }
          - { image: 'debian:stable', kind: tarball, glob: '*.tar.gz' }
          - { image: 'ubuntu:24.04', kind: appimage, glob: '*.AppImage' }
    name: smoke ${{ matrix.kind }} on ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stalemate-linux-native
          path: dist
      - name: Install and launch
        run: |
          f=$(ls dist/${{ matrix.glob }} | head -1)
          docker run --rm -v "$PWD:/w" -w /w ${{ matrix.image }} bash scripts/smoke-linux.sh ${{ matrix.kind }} "$f"

  # The AUR PKGBUILD, built from this commit's source in Arch, then installed and started.
  smoke-aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source tarball of this commit
        run: |
          ver=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          git archive --format=tar.gz --prefix="Stalemate-$ver/" -o "$RUNNER_TEMP/src.tar.gz" HEAD
      - name: Build, install and launch in Arch
        run: docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP:/t" -w /w archlinux:latest bash scripts/smoke-aur.sh /t/src.tar.gz /w
